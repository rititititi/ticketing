name: Publish admin ticket corrections
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Approved ticket review ID (32 hex characters)
        required: true
        type: string
permissions:
  contents: write
  actions: write
concurrency:
  group: admin-screenshot-updates
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply approved fields and rebuild feed
        env:
          JOB_ID: ${{ inputs.job_id }}
        run: python scripts/process_ticket_review.py --job "$JOB_ID"
      - name: Refresh downloadable site
        env:
          UU_SCOUT_ADMIN_URL: ${{ vars.UU_SCOUT_ADMIN_URL }}
          UU_SCOUT_NOTIFICATIONS_URL: ${{ vars.UU_SCOUT_NOTIFICATIONS_URL }}
        run: |
          python scripts/export_demo.py
          cp artifacts/uu-scout.zip uu-scout.zip
      - name: Commit reviewed result
        env:
          JOB_ID: ${{ inputs.job_id }}
        run: |
          git config user.name "uu scout reviews"
          git config user.email "actions@users.noreply.github.com"
          git add data/review-jobs data/admin-review data/catalog.json data/draft2 data/site-updates.json uu-scout.zip
          if test -d data/reviews; then git add data/reviews; fi
          if ! git diff --cached --quiet; then
            git commit -m "Publish ticket field review ${JOB_ID}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Deploy website
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
