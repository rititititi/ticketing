name: Publish uu scout
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'static/**'
      - 'templates/explorer.html'
      - 'scripts/export_demo.py'
      - 'data/catalog.json'
      - 'data/draft2/**'
      - '.github/workflows/pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build standalone bilingual site
        run: |
          python3 scripts/export_demo.py
          python3 -m zipfile -e artifacts/uu-scout.zip artifacts/pages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/pages/uu-scout
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
